<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferdows Archives | فردوس آرکایوز</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#d00000;--black:#111;--gray:#777;--line:#ddd;--white:#fff}
body{background:#fff;color:var(--black);font-family:"Vazirmatn","IRANSans",Tahoma,Arial,sans-serif}
a{color:inherit;text-decoration:none}

/* --- هدر --- */
.site-header{
  width:100%;
  padding:0 3vw 0;
  background:#fff;
}
.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:ltr;
  border-bottom:1px solid var(--line);
}

.brand{width:210px;height:58px;display:flex;align-items:center;justify-content:flex-start}
.brand img{width:100%;height:100%;object-fit:contain;object-position:left center;display:block}

.header-actions{display:flex;align-items:center;gap:24px;direction:ltr}
.icon-button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#111}
.icon-button svg{width:31px;height:31px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menu-icon,.menu-icon svg{width:60px;height:36px}
.menu-icon svg{stroke-width:2.2}

.menu-toggle{
  position:relative;
  border:0;
  background:transparent;
  cursor:pointer;
  padding:0;
  flex-direction:column;
  gap:7px;
}
.menu-toggle span{
  display:block;
  width:56px;
  height:2px;
  background:#111;
  transition:transform .25s ease, opacity .2s ease;
  transform-origin:center;
}
.menu-toggle.is-open span:nth-child(1){transform:translateY(9px) rotate(45deg)}
.menu-toggle.is-open span:nth-child(2){opacity:0}
.menu-toggle.is-open span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}

/* --- منوی کشویی --- */
.menu-panel{
  position:fixed;
  z-index:1000;
  top:91px;
  right:3vw;
  left:3vw;
  background:#fff;
  border-top:1px solid #ddd;
  box-shadow:0 18px 45px rgba(0,0,0,.12);
  transform:translateY(-18px);
  opacity:0;
  visibility:hidden;
  transition:opacity .25s ease, transform .25s ease, visibility .25s ease;
}
.menu-panel.is-open{
  transform:translateY(0);
  opacity:1;
  visibility:visible;
}
.menu-panel-inner{
  padding:45px 5vw 38px;
  display:grid;
  grid-template-columns:.7fr 2fr;
  gap:60px;
  direction:rtl;
}
.menu-heading{
  font-size:clamp(30px,4vw,58px);
  font-weight:800;
  color:var(--red);
}
.menu-links{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px 45px;
}
.menu-links a{
  font-size:clamp(19px,2vw,29px);
  border-bottom:1px solid #e5e5e5;
  padding:10px 0 15px;
  transition:color .2s ease;
}
.menu-links a:hover{color:var(--red)}
.menu-footer{
  grid-column:1 / -1;
  direction:ltr;
  color:#999;
  font-size:11px;
  letter-spacing:.18em;
  padding-top:20px;
}

/* --- هیرو (آیکون‌های شناور حذف شدند) --- */
.hero{
  width:94vw;
  max-width:1700px;
  margin: 0 auto;
  position:relative;
  overflow:hidden;
  background:#111;
}

.hero-image{
  width:100%;
  aspect-ratio:16/9;
  height:auto;
  object-fit:cover;
  object-position: center 30%;
  display:block;
  filter: brightness(1.0) contrast(1.05);
}

/* --- سایه‌ی هیرو --- */
.hero-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  direction:rtl;
  padding:clamp(25px,5vw,75px);
  background:linear-gradient(90deg, rgba(0,0,0,0.70) 0%, rgba(0,0,0,0.25) 35%, rgba(0,0,0,0) 65%);
}
/* -------------------------------------------- */

/* --- کتگوری‌ها (زوایای تیز، بدون گردی) --- */
.categories{
  width:94vw;
  max-width:1700px;
  margin:30px auto 20px;
  padding:0 10px;
  display:grid;
  gap:16px;
  direction:rtl;
}
.category{
  min-height:130px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#f8f8f8;
  border:1px solid #e0e0e0;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
  transition:all 0.25s ease;
  text-align:center;
  padding:20px;
}
.category:hover{
  transform:translateY(-3px);
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}
.category img{
  width:70px;
  height:70px;
  object-fit:contain;
  display:block;
  margin-bottom:10px;
}
.category-title{
  font-size:16px;
  font-weight:600;
  color:var(--black);
}
.category-description{
  color:var(--gray);
  font-size:12px;
  margin-top:4px;
}

/* --- دسکتاپ (۲ ردیف ۴ تایی) --- */
@media(min-width:851px){
  .categories{
    grid-template-columns: repeat(4, 1fr);
  }
}

/* --- تبلت و موبایل (۴ ردیف ۲ تایی) --- */
@media(max-width:850px){
.menu-panel{top:77px;right:4vw;left:4vw}
.menu-panel-inner{grid-template-columns:1fr;gap:25px;padding:30px 7vw}
.menu-links{grid-template-columns:1fr}
.menu-footer{padding-top:10px}

.site-header{padding:0 4vw 0;}
.topbar{height:65px}
.brand{width:170px;height:50px}
.header-actions{gap:10px}
.icon-button{width:30px}.icon-button svg{width:27px;height:27px}
.menu-icon,.menu-icon svg{width:43px}

.hero{width:92vw; margin: 0 auto;}
.hero-image{aspect-ratio:16/10;object-position: center 25%;}
.hero-overlay{padding:25px;background:linear-gradient(0deg, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.15) 75%);}

.categories{
  width:92vw;
  grid-template-columns: repeat(2, 1fr);
  gap:12px;
  padding:0 6px;
}
.category{
  min-height:110px;
  padding:15px;
}
.category img{
  width:55px;
  height:55px;
}
.category-title{
  font-size:15px;
}
}

@media(max-width:480px){
.brand{width:140px}
.header-actions{gap:5px}
.categories{
  gap:10px;
  padding:0 4px;
}
.category{
  min-height:95px;
  padding:12px;
}
.category img{
  width:45px;
  height:45px;
}
.category-title{
  font-size:14px;
}
}
</style>
</head>

<body>

<header class="site-header">
  <div class="topbar">
    <a href="#" class="brand" aria-label="Ferdows Archives">
      <img src="ferarch.svg" alt="Ferdows Archives">
    </a>
    <div class="header-actions">
      <a href="#" class="icon-button" aria-label="حساب کاربری">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="9" r="6"></circle><path d="M5 29c.7-7 4.2-10.5 11-10.5S26.3 22 27 29"></path></svg>
      </a>
      <a href="#" class="icon-button" aria-label="خانه">
        <svg viewBox="0 0 32 32"><path d="M4 14.5 16 4l12 10.5"></path><path d="M7 13v14h7v-8h4v8h7V13"></path></svg>
      </a>
      <button type="button" class="icon-button menu-icon menu-toggle" aria-label="باز کردن منو" aria-expanded="false" aria-controls="site-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="menu-panel" id="site-menu" aria-hidden="true">
  <div class="menu-panel-inner">
    <div class="menu-heading">آرشیو فردوس</div>
    <nav class="menu-links">
      <a href="#">آثار</a>
      <a href="#">هنرمندان</a>
      <a href="#">رشته‌ها</a>
      <a href="#">منتخب آرشیو</a>
      <a href="#">درباره آرشیو</a>
      <a href="#">ارسال اثر</a>
    </nav>
    <div class="menu-footer">ARCHIVE / ART / STUDENTS</div>
  </div>
</div>

<main>
  <section class="hero">
    <img class="hero-image" src="ferdows_archives_hero.png" alt="آرشیو سینمایی و پوسترهای آثار هنری">
    <div class="hero-overlay"></div>
  </section>

  <section class="categories">
    <a href="#" class="category">
      <img src="icon-cv.png" alt="CV">
      <div class="category-title">رزومه</div>
      <div class="category-description">نمایش کارنامه</div>
    </a>
    <a href="#" class="category">
      <img src="icon-shop.png" alt="Shop">
      <div class="category-title">فروشگاه</div>
      <div class="category-description">خرید آثار</div>
    </a>
    <a href="#" class="category">
      <img src="icon-podcast.png" alt="Podcast">
      <div class="category-title">پادکست</div>
      <div class="category-description">گفتگوهای هنری</div>
    </a>
    <a href="#" class="category">
      <img src="icon-play.png" alt="Play">
      <div class="category-title">پخش</div>
      <div class="category-description">ویدیوهای منتخب</div>
    </a>
    <a href="#" class="category">
      <img src="icon-film.png" alt="Film">
      <div class="category-title">فیلم</div>
      <div class="category-description">سینما و آثار</div>
    </a>
    <a href="#" class="category">
      <img src="icon-home.png" alt="Home">
      <div class="category-title">خانه</div>
      <div class="category-description">صفحه اصلی</div>
    </a>
    <a href="#" class="category">
      <img src="icon-gallery.png" alt="Gallery">
      <div class="category-title">گالری</div>
      <div class="category-description">نمایشگاه‌ها</div>
    </a>
    <a href="#" class="category">
      <img src="icon-palette.png" alt="Palette">
      <div class="category-title">هنرهای تجسمی</div>
      <div class="category-description">نقاشی و طرح</div>
    </a>
  </section>
</main>

<footer class="footer">
  <strong>آرشیو فردوس</strong>
  <p>ثبت امروز، ماندگاری فردا.</p>
</footer>

<script>
(function () {
  const toggle = document.querySelector('.menu-toggle');
  const panel = document.getElementById('site-menu');
  if (!toggle || !panel) return;
  toggle.addEventListener('click', function () {
    const isOpen = toggle.classList.toggle('is-open');
    panel.classList.toggle('is-open', isOpen);
    toggle.setAttribute('aria-expanded', String(isOpen));
    toggle.setAttribute('aria-label', isOpen ? 'بستن منو' : 'باز کردن منو');
    panel.setAttribute('aria-hidden', String(!isOpen));
  });
  panel.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function () {
      toggle.classList.remove('is-open');
      panel.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'باز کردن منو');
      panel.setAttribute('aria-hidden', 'true');
    });
  });
})();
</script>

</body>
</html>
